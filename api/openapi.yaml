openapi: 3.0.3
info:
  title: '[App name] API'
  version: 0.1.0
  description: Source of truth for the app, admin panel, mock server and back end. Money is whole kobo integers. Times are ISO 8601 UTC.
servers:
- url: http://localhost:4010
  description: Mock server (Prism)
- url: http://localhost:3000
  description: Real back end
security:
- bearerAuth: []
tags:
- name: Auth
- name: Account
- name: Browse
- name: Provider
- name: Bookings
- name: Payments
- name: Chat
- name: Disputes
- name: Notifications
- name: Admin
paths:
  /v1/auth/register:
    post:
      tags:
      - Auth
      security: []
      summary: Create an account (name, email, phone, password, role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
  /v1/auth/verify-email:
    post:
      tags:
      - Auth
      security: []
      summary: Confirm email with 6-digit code or link token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  example: '481926'
      responses:
        '200':
          $ref: '#/components/responses/AuthResult'
        '422':
          $ref: '#/components/responses/Invalid'
  /v1/auth/resend-verification:
    post:
      tags:
      - Auth
      security: []
      summary: Send the verification email again
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Sent
  /v1/auth/login:
    post:
      tags:
      - Auth
      security: []
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          $ref: '#/components/responses/AuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/refresh:
    post:
      tags:
      - Auth
      security: []
      summary: Exchange a refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/AuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/logout:
    post:
      tags:
      - Auth
      summary: End the session
      responses:
        '204':
          description: Done
  /v1/auth/forgot-password:
    post:
      tags:
      - Auth
      security: []
      summary: Send a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Sent if the account exists
  /v1/auth/reset-password:
    post:
      tags:
      - Auth
      security: []
      summary: Set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '204':
          description: Updated
        '422':
          $ref: '#/components/responses/Invalid'
  /v1/me:
    get:
      tags:
      - Account
      summary: Own profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: us_5
                name: Tola Adeyemi
                email: tola@email.com
                phone: '+2348012345678'
                role: customer
                photo_url: ''
                email_verified: true
                status: active
                emergency_contact:
                  name: Ngozi
                  phone: '+2348011122233'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Account
      summary: Update own profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                photo_url:
                  type: string
                area:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /v1/me/emergency-contact:
    put:
      tags:
      - Account
      summary: Set emergency contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - phone
              properties:
                name:
                  type: string
                phone:
                  type: string
      responses:
        '204':
          description: Saved
  /v1/me/favorites/{providerId}:
    parameters:
    - name: providerId
      in: path
      required: true
      schema:
        type: string
    put:
      tags:
      - Account
      summary: Save a stylist
      responses:
        '204':
          description: Saved
    delete:
      tags:
      - Account
      summary: Remove a saved stylist
      responses:
        '204':
          description: Removed
  /v1/uploads/sign:
    post:
      tags:
      - Account
      summary: Get a signed URL to upload a photo or file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - purpose
              - content_type
              properties:
                purpose:
                  type: string
                  enum:
                  - profile_photo
                  - portfolio
                  - id_document
                  - selfie
                  - dispute_evidence
                  - review_photo
                content_type:
                  type: string
                  example: image/jpeg
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url:
                    type: string
                  file_url:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
              example:
                upload_url: mock://upload
                file_url: ''
                expires_at: '2026-11-07T10:00:00Z'
  /v1/categories:
    get:
      tags:
      - Browse
      security: []
      summary: Service categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                      example: Makeup
              example:
              - id: makeup
                name: Makeup
              - id: braids
                name: Braids
              - id: wigs
                name: Wigs
              - id: nails
                name: Nails
              - id: lashes
                name: Lashes
              - id: barbers
                name: Barbers
  /v1/providers:
    get:
      tags:
      - Browse
      summary: Search stylists
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: area
        in: query
        schema:
          type: string
          example: Lekki
      - name: category
        in: query
        schema:
          type: string
      - name: min_price_kobo
        in: query
        schema:
          type: integer
      - name: max_price_kobo
        in: query
        schema:
          type: integer
      - name: date
        in: query
        schema:
          type: string
          format: date
      - name: min_rating
        in: query
        schema:
          type: number
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderSummary'
                  next_cursor:
                    type: string
                    nullable: true
              example:
                items:
                - id: pr_88
                  name: Ada's Glam Studio
                  cover_photo_url: ''
                  categories: &id001
                  - Makeup
                  areas: &id002
                  - Lekki
                  - Yaba
                  from_price_kobo: 2500000
                  rating_avg: 4.9
                  review_count: 38
                  verified: true
                  is_favorite: false
                - id: pr_91
                  name: Zainab Hair Lounge
                  cover_photo_url: ''
                  categories:
                  - Braids
                  - Wigs
                  areas:
                  - Ikeja
                  - Yaba
                  from_price_kobo: 4000000
                  rating_avg: 4.7
                  review_count: 52
                  verified: true
                  is_favorite: false
                - id: pr_95
                  name: Chike Cuts
                  cover_photo_url: ''
                  categories:
                  - Barbers
                  areas:
                  - Ikeja
                  - Surulere
                  from_price_kobo: 500000
                  rating_avg: 4.8
                  review_count: 64
                  verified: true
                  is_favorite: false
                - id: pr_97
                  name: Bimpe Beauty
                  cover_photo_url: ''
                  categories:
                  - Lashes
                  - Nails
                  areas:
                  - Lekki
                  from_price_kobo: 1500000
                  rating_avg: 4.6
                  review_count: 21
                  verified: true
                  is_favorite: false
                next_cursor: null
  /v1/providers/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Browse
      summary: Stylist profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetail'
              example:
                id: pr_88
                name: Ada's Glam Studio
                cover_photo_url: ''
                categories: *id001
                areas: *id002
                from_price_kobo: 2500000
                rating_avg: 4.9
                review_count: 38
                verified: true
                is_favorite: false
                bio: Makeup artist for weddings, events and everyday glam. I come to you with a full kit.
                years_experience: 7
                completed_bookings: 120
                services:
                - id: sv_1
                  title: Soft glam makeup
                  category: Makeup
                  description: Natural, long-lasting glam for any occasion.
                  price_kobo: 2500000
                  duration_minutes: 90
                  is_active: true
                - id: sv_3
                  title: Knotless braids, medium
                  category: Braids
                  description: Lightweight, neat and gentle on the scalp.
                  price_kobo: 4500000
                  duration_minutes: 300
                  is_active: true
                - id: sv_4
                  title: Bridal makeup and gele
                  category: Makeup
                  description: Full bridal look with gele tying.
                  price_kobo: 9000000
                  duration_minutes: 180
                  is_active: true
                portfolio:
                - id: pf_1
                  image_url: ''
                  caption: Box braids
                  sort_order: 1
                - id: pf_2
                  image_url: ''
                  caption: Bridal makeup
                  sort_order: 2
                - id: pf_3
                  image_url: ''
                  caption: Wig install
                  sort_order: 3
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/providers/{id}/availability:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Browse
      summary: Open slots for a service
      parameters:
      - name: service_id
        in: query
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    starts_at:
                      type: string
                      format: date-time
              example:
              - starts_at: '2026-11-07T07:00:00Z'
              - starts_at: '2026-11-07T10:00:00Z'
              - starts_at: '2026-11-07T13:00:00Z'
              - starts_at: '2026-11-08T09:00:00Z'
              - starts_at: '2026-11-08T12:00:00Z'
              - starts_at: '2026-11-09T08:00:00Z'
              - starts_at: '2026-11-09T11:00:00Z'
              - starts_at: '2026-11-09T14:00:00Z'
  /v1/providers/{id}/reviews:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Browse
      summary: Reviews
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
  /v1/provider/onboarding:
    get:
      tags:
      - Provider
      summary: Verification checklist and status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onboarding'
              example:
                id_status: done
                selfie_status: todo
                bank_status: todo
                portfolio_status: todo
                overall: incomplete
  /v1/provider/onboarding/id:
    post:
      tags:
      - Provider
      summary: Submit ID document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id_type
              - id_number
              - image_url
              properties:
                id_type:
                  type: string
                  enum:
                  - nin
                  - passport
                  - drivers_licence
                  - voters_card
                id_number:
                  type: string
                image_url:
                  type: string
      responses:
        '202':
          description: Submitted for checking
  /v1/provider/onboarding/selfie:
    post:
      tags:
      - Provider
      summary: Submit selfie for matching
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - image_url
              properties:
                image_url:
                  type: string
      responses:
        '202':
          description: Submitted for checking
  /v1/provider/bank-account:
    put:
      tags:
      - Provider
      summary: Set payout account (name must match ID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bank_code
              - account_number
              properties:
                bank_code:
                  type: string
                account_number:
                  type: string
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_name:
                    type: string
                  bank_name:
                    type: string
              example:
                account_name: ADA OKAFOR
                bank_name: Zenith Bank
        '422':
          $ref: '#/components/responses/Invalid'
  /v1/provider/profile:
    get:
      tags:
      - Provider
      summary: Own stylist profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDetail'
    put:
      tags:
      - Provider
      summary: Update bio, areas, categories
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bio:
                  type: string
                years_experience:
                  type: integer
                areas:
                  type: array
                  items:
                    type: string
                categories:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: OK
  /v1/provider/services:
    get:
      tags:
      - Provider
      summary: List services
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
              example:
              - &id003
                id: sv_1
                title: Soft glam makeup
                category: Makeup
                description: Natural, long-lasting glam.
                price_kobo: 2500000
                duration_minutes: 90
                is_active: true
              - id: sv_3
                title: Knotless braids, medium
                category: Braids
                description: Lightweight and neat.
                price_kobo: 4500000
                duration_minutes: 300
                is_active: true
              - id: sv_4
                title: Bridal makeup and gele
                category: Makeup
                description: Full bridal look with gele tying.
                price_kobo: 9000000
                duration_minutes: 180
                is_active: true
    post:
      tags:
      - Provider
      summary: Add a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
              example: *id003
  /v1/provider/services/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    patch:
      tags:
      - Provider
      summary: Edit a service
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
              example: *id003
    delete:
      tags:
      - Provider
      summary: Remove a service
      responses:
        '204':
          description: Removed
  /v1/provider/availability:
    get:
      tags:
      - Provider
      summary: Weekly hours
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hours'
              example:
              - day_of_week: 1
                start_time: 09:00
                end_time: '18:00'
              - day_of_week: 2
                start_time: 09:00
                end_time: '18:00'
              - day_of_week: 4
                start_time: 09:00
                end_time: '18:00'
              - day_of_week: 6
                start_time: 07:00
                end_time: '20:00'
    put:
      tags:
      - Provider
      summary: Replace weekly hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Hours'
      responses:
        '204':
          description: Saved
  /v1/provider/blocked-dates:
    post:
      tags:
      - Provider
      summary: Block a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - date
              properties:
                date:
                  type: string
                  format: date
      responses:
        '201':
          description: Blocked
    get:
      tags:
      - Provider
      summary: List blocked dates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date
              example:
              - '2026-11-12'
              - '2026-11-20'
  /v1/provider/blocked-dates/{date}:
    parameters:
    - name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    delete:
      tags:
      - Provider
      summary: Unblock a date
      responses:
        '204':
          description: Removed
  /v1/provider/portfolio:
    get:
      tags:
      - Provider
      summary: List photos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioItem'
              example:
              - id: pf_1
                image_url: ''
                caption: Box braids
                service_id: null
                sort_order: 1
              - id: pf_2
                image_url: ''
                caption: Bridal makeup
                service_id: null
                sort_order: 2
              - id: pf_3
                image_url: ''
                caption: Soft glam
                service_id: null
                sort_order: 3
              - id: pf_4
                image_url: ''
                caption: Wig install
                service_id: null
                sort_order: 4
    post:
      tags:
      - Provider
      summary: Add a photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - image_url
              properties:
                image_url:
                  type: string
                caption:
                  type: string
                service_id:
                  type: string
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioItem'
              example:
                id: pf_9
                image_url: ''
                caption: null
                service_id: null
                sort_order: 5
  /v1/provider/portfolio/order:
    put:
      tags:
      - Provider
      summary: Reorder photos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '204':
          description: Saved
  /v1/provider/portfolio/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    patch:
      tags:
      - Provider
      summary: Edit caption
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                caption:
                  type: string
      responses:
        '200':
          description: OK
    delete:
      tags:
      - Provider
      summary: Remove a photo
      responses:
        '204':
          description: Removed
  /v1/provider/dashboard:
    get:
      tags:
      - Provider
      summary: Today, new requests, weekly earnings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  earned_this_week_kobo:
                    type: integer
                  held_kobo:
                    type: integer
                  new_requests:
                    type: integer
                  today:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
              example:
                earned_this_week_kobo: 13500000
                held_kobo: 4500000
                new_requests: 3
                today:
                - id: bk_1042
                  status: paid
                  provider:
                    id: pr_88
                    name: Ada's Glam Studio
                    photo_url: ''
                  customer:
                    id: us_5
                    name: Tola Adeyemi
                  service:
                    id: sv_3
                    title: Knotless braids, medium
                  scheduled_at: '2026-11-07T08:00:00Z'
                  area: Lekki
                  address: 12 Admiralty Way, Lekki Phase 1
                  price_kobo: 4500000
                  allowed_actions: []
                  events: []
                - id: bk_1043
                  status: paid
                  provider:
                    id: pr_88
                    name: Ada's Glam Studio
                    photo_url: ''
                  customer:
                    id: us_5
                    name: Tola Adeyemi
                  service:
                    id: sv_3
                    title: Soft glam makeup
                  scheduled_at: '2026-11-07T14:00:00Z'
                  area: Lekki
                  address: 12 Admiralty Way, Lekki Phase 1
                  price_kobo: 4500000
                  allowed_actions: []
                  events: []
  /v1/provider/earnings:
    get:
      tags:
      - Provider
      summary: Pending, paid out, history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending_kobo:
                    type: integer
                  paid_out_kobo:
                    type: integer
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payout'
              example:
                pending_kobo: 4500000
                paid_out_kobo: 9000000
                history:
                - id: po_1
