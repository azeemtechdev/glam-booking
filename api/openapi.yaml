              example: *id005
  /v1/banks:
    get:
      tags:
      - Provider
      summary: Supported banks for payouts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    name:
                      type: string
              example:
              - code: '044'
                name: Access Bank
              - code: '058'
                name: GTBank
              - code: '057'
                name: Zenith Bank
              - code: '033'
                name: UBA
              - code: '011'
                name: First Bank
              - code: '070'
                name: Fidelity Bank
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
  responses:
    AuthResult:
      description: Signed in
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResult'
    BookingOk:
      description: Updated booking
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Booking'
    Unauthorized:
      description: Not signed in or bad credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State conflict (slot taken, wrong status, already paid)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: BOOKING_SLOT_TAKEN
            message:
              type: string
              example: That time is no longer free
    RegisterRequest:
      type: object
      required:
      - name
      - email
      - phone
      - password
      - role
      properties:
        name:
          type: string
          example: Tola Adeyemi
        email:
          type: string
          format: email
        phone:
          type: string
          example: '+2348012345678'
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum:
          - customer
          - provider
    AuthResult:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - customer
          - provider
          - admin
        photo_url:
          type: string
          nullable: true
        email_verified:
          type: boolean
        status:
          type: string
          enum:
          - active
          - suspended
        phone:
          type: string
        emergency_contact:
          type: object
          nullable: true
          properties:
            name:
              type: string
            phone:
              type: string
    ProviderSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Ada's Glam Studio
        cover_photo_url:
          type: string
        categories:
          type: array
          items:
            type: string
        areas:
          type: array
          items:
            type: string
        from_price_kobo:
          type: integer
          example: 2500000
        rating_avg:
          type: number
          nullable: true
        review_count:
          type: integer
        verified:
          type: boolean
        is_favorite:
          type: boolean
    ProviderDetail:
      allOf:
      - $ref: '#/components/schemas/ProviderSummary'
      - type: object
        properties:
          bio:
            type: string
          years_experience:
            type: integer
          completed_bookings:
            type: integer
          services:
            type: array
            items:
              $ref: '#/components/schemas/Service'
          portfolio:
            type: array
            items:
              $ref: '#/components/schemas/PortfolioItem'
    Service:
      allOf:
      - $ref: '#/components/schemas/ServiceInput'
      - type: object
        properties:
          id:
            type: string
    ServiceInput:
      type: object
      required:
      - title
      - category
      - price_kobo
      - duration_minutes
      properties:
        title:
          type: string
          example: Knotless braids medium
        category:
          type: string
        description:
          type: string
        price_kobo:
          type: integer
          example: 4500000
        duration_minutes:
          type: integer
          example: 300
        is_active:
          type: boolean
          default: true
    Hours:
      type: object
      required:
      - day_of_week
      - start_time
      - end_time
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        start_time:
          type: string
          example: 09:00
        end_time:
          type: string
          example: '18:00'
    PortfolioItem:
      type: object
      properties:
        id:
          type: string
        image_url:
          type: string
        caption:
          type: string
          nullable: true
        service_id:
          type: string
          nullable: true
        sort_order:
          type: integer
    Onboarding:
      type: object
      properties:
        id_status:
          $ref: '#/components/schemas/StepStatus'
        selfie_status:
          $ref: '#/components/schemas/StepStatus'
        bank_status:
          $ref: '#/components/schemas/StepStatus'
        portfolio_status:
          $ref: '#/components/schemas/StepStatus'
        overall:
          type: string
          enum:
          - incomplete
          - in_review
          - approved
          - rejected
    StepStatus:
      type: string
      enum:
      - todo
      - submitted
      - done
      - rejected
    BookingStatus:
      type: string
      enum:
      - requested
      - accepted
      - paid
      - on_the_way
      - completed_by_provider
      - confirmed
      - released
      - declined
      - expired
      - cancelled
      - disputed
      - refunded
    BookingCreate:
      type: object
      required:
      - provider_id
      - service_id
      - scheduled_at
      - address
      - area
      properties:
        provider_id:
          type: string
        service_id:
          type: string
        scheduled_at:
          type: string
          format: date-time
        address:
          type: string
        area:
          type: string
        notes:
          type: string
    Booking:
      type: object
      properties:
        id:
          type: string
          example: bk_1042
        status:
          $ref: '#/components/schemas/BookingStatus'
        provider:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            photo_url:
              type: string
        customer:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        service:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
        scheduled_at:
          type: string
          format: date-time
        area:
          type: string
        address:
          type: string
          description: Shown to the provider only after payment
        price_kobo:
          type: integer
        allowed_actions:
          type: array
          items:
            type: string
            enum:
            - accept
            - decline
            - cancel
            - pay
            - on_the_way
            - complete
            - confirm
            - open_dispute
            - review
            - open_chat
            - share_with_contact
            - help
        events:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              actor:
                type: string
              at:
                type: string
                format: date-time
    Payment:
      type: object
      properties:
        status:
          type: string
          enum:
          - none
          - pending
          - held
          - released
          - refunded
          - failed
        amount_kobo:
          type: integer
        fee_kobo:
          type: integer
        payout_kobo:
          type: integer
        paid_at:
          type: string
          format: date-time
          nullable: true
    Payout:
      type: object
      properties:
        id:
          type: string
        booking_id:
          type: string
        provider_name:
          type: string
        amount_kobo:
          type: integer
        fee_kobo:
          type: integer
        status:
          type: string
          enum:
          - held
          - released
          - failed
        released_at:
          type: string
          format: date-time
          nullable: true
    Review:
      type: object
      properties:
        id:
          type: string
        rating:
          type: integer
        comment:
          type: string
        photo_urls:
          type: array
          items:
            type: string
        author_name:
          type: string
        created_at:
          type: string
          format: date-time
    Conversation:
      type: object
      properties:
        id:
          type: string
        booking_id:
          type: string
        other_party:
          type: object
          properties:
            name:
              type: string
            photo_url:
              type: string
        last_message:
          type: string
        unread:
          type: integer
        updated_at:
          type: string
          format: date-time
    Message:
      type: object
      properties:
        id:
          type: string
        sender_id:
          type: string
        body:
          type: string
        masked:
          type: boolean
          description: True if contact details were hidden
        sent_at:
          type: string
          format: date-time
    Dispute:
      type: object
      properties:
        id:
          type: string
        booking_id:
          type: string
        reason:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - open
          - resolved
        outcome:
          type: string
          nullable: true
        amount_kobo:
          type: integer
        created_at:
          type: string
          format: date-time
        customer_name:
          type: string
        provider_name:
          type: string
        service_title:
          type: string
    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        body:
          type: string
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
    Verification:
      type: object
      properties:
        id:
          type: string
        user_name:
          type: string
        role:
          type: string
        id_type:
          type: string
        selfie_match:
          type: string
          enum:
          - match
          - review
          - no_match
        submitted_at:
          type: string
          format: date-time
    Settings:
      type: object
      properties:
        commission_percent:
          type: number
          example: 12
        provider_response_hours:
          type: integer
          example: 12
        payment_window_hours:
          type: integer
          example: 2
        auto_confirm_hours:
          type: integer
          example: 48
        free_cancel_hours:
          type: integer
          example: 24